<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f4">
<meta name="description" content="Портфолио Дианы Фатыковой — графический дизайн, айдентика, иллюстрация и визуальные концепции.">
<title>Диана Фатыкова — графический дизайнер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f4;--ink:#20201e;--muted:#777770;--line:#dcdcd5;--accent:#557e78;--max:1440px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}.wrap{width:min(calc(100% - 72px),var(--max));margin:auto}
header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative;z-index:5}
.nav{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:15px;font-weight:700;letter-spacing:-.04em}.navlinks{display:flex;gap:28px;font-size:12px;color:#55554f}.navlinks a:hover,.back:hover{color:var(--accent)}
.hero{padding:92px 0 78px;display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:end}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 24px}
h1{font-size:clamp(54px,8vw,118px);line-height:.94;letter-spacing:-.085em;font-weight:500;margin:0;max-width:850px}
.hero-side{max-width:390px;padding-bottom:8px}.role{font-size:17px;margin:0 0 14px}.intro{font-size:13px;line-height:1.9;color:var(--muted);margin:0}
.section-head{border-top:1px solid var(--line);padding:24px 0 28px;display:flex;justify-content:space-between;align-items:baseline}
h2{font-size:22px;letter-spacing:-.05em;font-weight:600;margin:0}.count{font-size:11px;color:var(--muted)}
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:54px 24px;padding-bottom:92px}
.project-card{display:block;min-width:0}.project-image{background:#e9e9e3;overflow:hidden;aspect-ratio:1.52;display:flex;align-items:center;justify-content:center}
.project-image img{width:100%;height:100%;object-fit:contain;transition:transform .55s cubic-bezier(.2,.7,.2,1)}.project-card:hover .project-image img{transform:scale(1.025)}
.card-meta{display:flex;justify-content:space-between;gap:16px;margin-top:15px;align-items:baseline}.card-title{font-size:17px;letter-spacing:-.04em;font-weight:600}.card-type{font-size:10px;color:var(--muted);text-align:right}
.card-desc{font-size:11px;line-height:1.7;color:var(--muted);margin:7px 0 0;max-width:550px}
.categories{padding-bottom:100px}.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.category-link{border:1px solid var(--line);padding:24px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between;transition:background .2s,border-color .2s}
.category-link:hover{background:#eeeee8;border-color:#bdbdb4}.category-link strong{font-size:18px;font-weight:600;letter-spacing:-.04em}.category-link span{font-size:11px;color:var(--muted)}
.work-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding-bottom:90px}.work-tile{background:#ecece6;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:180px}.work-tile img{width:100%;height:100%;max-height:360px;object-fit:contain}
footer{border-top:1px solid var(--line);padding:26px 0 34px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.page-top{padding:45px 0 28px}.back{font-size:12px;color:var(--muted);display:inline-block;margin-bottom:30px}.page-title{font-size:clamp(34px,6vw,72px);line-height:1;letter-spacing:-.075em;font-weight:500;margin:0 0 14px}.page-description{font-size:12px;color:var(--muted);line-height:1.8;max-width:600px;margin:0}
.slides{padding:10px 0 80px;display:flex;flex-direction:column;gap:22px}.slide{margin:0;background:#eeeee9;display:flex;justify-content:center;align-items:center}.slide img{display:block;width:100%;height:auto;max-height:calc(100vh - 80px);object-fit:contain}.slide-number{font-size:10px;color:var(--muted);text-align:right;padding:8px 0 0}
.gallery-intro{padding:48px 0 32px}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:90px}
.gallery-item{border:0;padding:0;background:#ededE7;cursor:zoom-in;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;min-height:160px}
.gallery-item img{display:block;width:100%;height:100%;max-height:520px;object-fit:contain;transition:transform .35s}.gallery-item:hover img{transform:scale(1.025)}
.gallery-grid.illustrations .gallery-item{aspect-ratio:4/5}.gallery-grid.covers .gallery-item{aspect-ratio:3/4}.gallery-grid.additional .gallery-item{aspect-ratio:4/3}
.lightbox{position:fixed;inset:0;background:rgba(18,18,17,.94);z-index:20;display:none;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox button{position:absolute;background:transparent;border:0;color:white;font-size:30px;cursor:pointer;padding:12px}.lightbox .close{right:18px;top:8px}.lightbox .prev{left:12px;top:50%;transform:translateY(-50%)}.lightbox .next{right:12px;top:50%;transform:translateY(-50%)}
.empty{padding:40px 0;color:var(--muted)}.download{display:inline-block;border:1px solid var(--line);padding:11px 16px;font-size:11px;margin-top:20px}.download:hover{border-color:var(--ink)}
@media(max-width:760px){.wrap{width:calc(100% - 36px)}header{height:64px}.navlinks{gap:13px;font-size:10px}.brand{font-size:13px}.hero{grid-template-columns:1fr;gap:28px;padding:68px 0 55px}.hero-side{max-width:480px}.project-grid{grid-template-columns:1fr;gap:38px;padding-bottom:70px}.project-image{aspect-ratio:1.3}.category-grid{grid-template-columns:1fr 1fr}.category-link{min-height:120px;padding:18px}.work-strip{grid-template-columns:1fr}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gallery-item{min-height:120px}.gallery-grid.illustrations .gallery-item{aspect-ratio:3/4}.gallery-grid.covers .gallery-item{aspect-ratio:3/4}.page-top{padding:32px 0 20px}.slides{gap:12px;padding-bottom:55px}.slide img{max-height:none}.card-meta{display:block}.card-type{text-align:left;margin-top:6px}.section-head{padding:20px 0}.lightbox{padding:12px}.lightbox button{font-size:26px}.lightbox .close{right:8px;top:0}}
@media(max-width:390px){.navlinks{gap:9px}.navlinks a{font-size:9px}.category-grid{grid-template-columns:1fr}.gallery-grid{gap:6px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#/">ДИАНА ФАТЫКОВА</a><nav class="navlinks"><a href="#/">Проекты</a><a href="#/gallery/illustrations">Иллюстрации</a><a href="#/gallery/covers">ИИ-обложки</a><a href="#/gallery/additional">Другие работы</a></nav></div></header>
<main id="app"></main>
<footer><div class="wrap" style="display:flex;justify-content:space-between;gap:20px"><span>© Диана Фатыкова</span><span>Графический дизайнер</span></div></footer>
<div class="lightbox" id="lightbox" aria-modal="true" role="dialog"><button class="close" aria-label="Закрыть">×</button><button class="prev" aria-label="Предыдущее">‹</button><img alt=""><button class="next" aria-label="Следующее">›</button></div>
<script>
const DATA={"projects": [{"slug": "mormar", "title": "Фирменный стиль «МОРЬМАР»", "meta": "Графический дизайн · Айдентика", "description": "Разработка фирменного стиля: логотип, типографика, цветовая система и примеры применения.", "preview": "assets/projects/mormar-01.jpg", "pages": ["assets/projects/mormar-01.jpg", "assets/projects/mormar-02.jpg", "assets/projects/mormar-03.jpg", "assets/projects/mormar-04.jpg", "assets/projects/mormar-05.jpg", "assets/projects/mormar-06.jpg", "assets/projects/mormar-07.jpg", "assets/projects/mormar-08.jpg"], "pdf": "assets/pdfs/Граф МОРЬМАР.pdf"}, {"slug": "graphic-design", "title": "Графический дизайн", "meta": "Портфолио · Редакционный дизайн", "description": "Подборка графических и редакционных проектов, визуальных концепций, упаковки и материалов.", "preview": "assets/projects/graphic-design-01.jpg", "pages": ["assets/projects/graphic-design-01.jpg", "assets/projects/graphic-design-02.jpg", "assets/projects/graphic-design-03.jpg", "assets/projects/graphic-design-04.jpg", "assets/projects/graphic-design-05.jpg", "assets/projects/graphic-design-06.jpg", "assets/projects/graphic-design-07.jpg", "assets/projects/graphic-design-08.jpg", "assets/projects/graphic-design-09.jpg", "assets/projects/graphic-design-10.jpg", "assets/projects/graphic-design-11.jpg", "assets/projects/graphic-design-12.jpg"], "pdf": "assets/pdfs/Графический дизайн Фатыкова Диана .pdf"}, {"slug": "bus-stop", "title": "Проектирование остановочного пункта", "meta": "Концепция · Средовой дизайн", "description": "Проектирование остановочного пункта и визуальная подача архитектурно-дизайнерской концепции.", "preview": "assets/projects/bus-stop-01.jpg", "pages": ["assets/projects/bus-stop-01.jpg"], "pdf": "assets/pdfs/Проектирование остановочного пункта.pdf"}], "illustrations": [{"src": "assets/images/571d9102810ca92738fb833cdb392cb4.webp", "alt": "571d9102810ca92738fb833cdb392cb4", "name": "571d9102810ca92738fb833cdb392cb4"}, {"src": "assets/images/screenshot-20261114-045022-ibispaint-x.webp", "alt": "Screenshot 20261114 045022 ibisPaint X", "name": "Screenshot 20261114 045022 ibisPaint X"}, {"src": "assets/images/screenshot-20261114-045054-ibispaint-x.webp", "alt": "Screenshot 20261114 045054 ibisPaint X", "name": "Screenshot 20261114 045054 ibisPaint X"}, {"src": "assets/images/screenshot-20261114-045116-ibispaint-x.webp", "alt": "Screenshot 20261114 045116 ibisPaint X", "name": "Screenshot 20261114 045116 ibisPaint X"}, {"src": "assets/images/screenshot-20261114-045154-gallery.webp", "alt": "Screenshot 20261114 045154 Gallery", "name": "Screenshot 20261114 045154 Gallery"}, {"src": "assets/images/screenshot-20261114-045211-gallery.webp", "alt": "Screenshot 20261114 045211 Gallery", "name": "Screenshot 20261114 045211 Gallery"}, {"src": "assets/images/screenshot-20261114-045259-gallery.webp", "alt": "Screenshot 20261114 045259 Gallery", "name": "Screenshot 20261114 045259 Gallery"}, {"src": "assets/images/screenshot-20261114-045540-gallery.webp", "alt": "Screenshot 20261114 045540 Gallery", "name": "Screenshot 20261114 045540 Gallery"}, {"src": "assets/images/screenshot-20261114-045554-gallery.webp", "alt": "Screenshot 20261114 045554 Gallery", "name": "Screenshot 20261114 045554 Gallery"}, {"src": "assets/images/screenshot-20261114-045758-gallery.webp", "alt": "Screenshot 20261114 045758 Gallery", "name": "Screenshot 20261114 045758 Gallery"}, {"src": "assets/images/cabc53350e4f312b7cf3ddc6cf0a9232.webp", "alt": "cabc53350e4f312b7cf3ddc6cf0a9232", "name": "cabc53350e4f312b7cf3ddc6cf0a9232"}, {"src": "assets/images/d21b13caa7c34382f5c6a0822423099c.webp", "alt": "d21b13caa7c34382f5c6a0822423099c", "name": "d21b13caa7c34382f5c6a0822423099c"}], "covers": [{"src": "assets/images/a4-7.webp", "alt": "A4 - 7", "name": "A4 - 7"}, {"src": "assets/images/frame-215.webp", "alt": "Frame 215", "name": "Frame 215"}, {"src": "assets/images/frame-216.webp", "alt": "Frame 216", "name": "Frame 216"}, {"src": "assets/images/img-20261114-143854-362.webp", "alt": "IMG 20261114 143854 362", "name": "IMG 20261114 143854 362"}, {"src": "assets/images/img-20261114-143953-431.webp", "alt": "IMG 20261114 143953 431", "name": "IMG 20261114 143953 431"}, {"src": "assets/images/img-20261114-212946-859.webp", "alt": "IMG 20261114 212946 859", "name": "IMG 20261114 212946 859"}, {"src": "assets/images/file-00000000944c8210a168e46c6cca96da.webp", "alt": "file 00000000944c8210a168e46c6cca96da", "name": "file 00000000944c8210a168e46c6cca96da"}], "additional": [{"src": "assets/images/граф-канал-в-тг.webp", "alt": "Граф канал в тг", "name": "Граф канал в тг"}, {"src": "assets/images/женский-журнал.webp", "alt": "Женский журнал", "name": "Женский журнал"}, {"src": "assets/images/календарь-смешарики.webp", "alt": "Календарь  \"Смешарики\"", "name": "Календарь  \"Смешарики\""}, {"src": "assets/images/проект-верстки-изданий.webp", "alt": "Проект вёрстки изданий", "name": "Проект вёрстки изданий"}]};
const app=document.getElementById('app');
const lb=document.getElementById('lightbox');const lbImg=lb.querySelector('img');let galleryItems=[],galleryIndex=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){
 document.title='Диана Фатыкова — графический дизайнер';
 app.innerHTML=`<div class="wrap">
 <section class="hero"><div><p class="eyebrow">Портфолио · 2026</p><h1>Диана<br>Фатыкова</h1></div><div class="hero-side"><p class="role">Графический дизайнер</p><p class="intro">Графический дизайн, разработка визуальных концепций, айдентика, иллюстрация, визуальные материалы и обложки.</p></div></section>
 <section><div class="section-head"><h2>Избранные проекты</h2><span class="count">03 проекта</span></div><div class="project-grid">${DATA.projects.map(p=>`<a class="project-card" href="#/project/${p.slug}"><div class="project-image"><img src="${p.preview}" alt="${esc(p.title)}" loading="lazy"></div><div class="card-meta"><span class="card-title">${esc(p.title)}</span><span class="card-type">${esc(p.meta)}</span></div><p class="card-desc">${esc(p.description)}</p></a>`).join('')}</div></section>
 <section class="categories"><div class="section-head"><h2>Галереи</h2><span class="count">Авторские работы</span></div><div class="category-grid">
 <a class="category-link" href="#/gallery/illustrations"><strong>Иллюстрации</strong><span>${DATA.illustrations.length} работ ↗</span></a>
 <a class="category-link" href="#/gallery/covers"><strong>ИИ-обложки</strong><span>${DATA.covers.length} работ ↗</span></a>
 <a class="category-link" href="#/gallery/additional"><strong>Другие работы</strong><span>${DATA.additional.length} работ ↗</span></a>
 </div></section>
 <section><div class="section-head"><h2>Дополнительные проекты</h2><span class="count">Вне презентаций</span></div><div class="work-strip">${DATA.additional.slice(0,2).map(x=>`<div class="work-tile"><img src="${x.src}" alt="${esc(x.alt)}" loading="lazy"></div>`).join('')}</div></section>
 </div>`;
}
function project(slug){
 const p=DATA.projects.find(x=>x.slug===slug);if(!p){home();return}
 document.title=p.title+' — Диана Фатыкова';
 app.innerHTML=`<div class="wrap"><section class="page-top"><a class="back" href="#/">← На главную</a><h1 class="page-title">${esc(p.title)}</h1><p class="page-description">${esc(p.meta)}<br>${esc(p.description)}</p><a class="download" href="${p.pdf}" target="_blank" rel="noopener">Открыть оригинальную PDF-презентацию ↗</a></section><section class="slides">${p.pages.map((src,i)=>`<figure><div class="slide"><img src="${src}" alt="${esc(p.title)}, слайд ${i+1}" ${i>1?'loading="lazy"':''}></div><figcaption class="slide-number">${String(i+1).padStart(2,'0')} / ${String(p.pages.length).padStart(2,'0')}</figcaption></figure>`).join('')}</section></div>`;
}
const galleryTitles={illustrations:'Иллюстрации',covers:'ИИ-обложки',additional:'Другие работы'};
function gallery(type){
 const items=DATA[type]||[];document.title=galleryTitles[type]+' — Диана Фатыкова';
 app.innerHTML=`<div class="wrap"><section class="gallery-intro"><a class="back" href="#/">← На главную</a><p class="eyebrow">Галерея · ${items.length} работ</p><h1 class="page-title">${galleryTitles[type]||'Галерея'}</h1></section><section class="gallery-grid ${type}">${items.map((x,i)=>`<button class="gallery-item" data-index="${i}" aria-label="Открыть изображение ${i+1}"><img src="${x.src}" alt="${esc(x.alt)}" loading="lazy"></button>`).join('')}</section></div>`;
 galleryItems=items;
 app.querySelectorAll('.gallery-item').forEach(el=>el.addEventListener('click',()=>openLightbox(Number(el.dataset.index))));
}
function route(){const parts=location.hash.replace(/^#\/?/,'').split('/');if(!parts[0])home();else if(parts[0]==='project')project(parts[1]);else if(parts[0]==='gallery')gallery(parts[1]);else home();window.scrollTo(0,0)}
function openLightbox(i){galleryIndex=i;lbImg.src=galleryItems[i].src;lbImg.alt=galleryItems[i].alt;lb.classList.add('open');document.body.style.overflow='hidden'}
function closeLightbox(){lb.classList.remove('open');document.body.style.overflow=''}
function step(n){if(!galleryItems.length)return;galleryIndex=(galleryIndex+n+galleryItems.length)%galleryItems.length;lbImg.src=galleryItems[galleryIndex].src;lbImg.alt=galleryItems[galleryIndex].alt}
lb.querySelector('.close').onclick=closeLightbox;lb.querySelector('.prev').onclick=()=>step(-1);lb.querySelector('.next').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb)closeLightbox()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
window.addEventListener('hashchange',route);route();
</script>
</body></html>
